worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml application/octet-stream image/svg+xml;
    gzip_min_length 256;

    server {
        listen 7000;
        server_name _;

        absolute_redirect off;
        port_in_redirect off;

        root /usr/share/nginx/html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        error_page 404 /index.html;
    }
}
