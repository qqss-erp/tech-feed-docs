<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#eef7fb" />
      <stop offset="100%" stop-color="#f8fbff" />
    </linearGradient>
    <linearGradient id="g2" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#cfeff6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e7f6ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>
  <!-- background -->
  <rect width="100%" height="100%" fill="url(#g1)" />

  <!-- subtle circuit pattern -->
  <g fill="none" stroke="#8fcfe8" stroke-opacity="0.8" stroke-width="3">
    <!-- left cluster -->
    <path d="M200 140 C 260 100, 360 100, 420 140" stroke-linecap="round" />
    <path d="M200 180 C 260 220, 360 220, 420 180" stroke-linecap="round" />
    <circle cx="200" cy="140" r="6" fill="#1b8fb4" stroke="none" />
    <circle cx="420" cy="140" r="6" fill="#1b8fb4" stroke="none" />
    <circle cx="200" cy="180" r="6" fill="#42c4d6" stroke="none" />
    <circle cx="420" cy="180" r="6" fill="#42c4d6" stroke="none" />
  </g>

  <!-- mid-right technical lines -->
  <g stroke="#6aaed1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M620 120 L820 120 L980 220 L1260 220 L1500 160" />
    <path d="M620 180 L760 180 L980 260 L1240 260 L1520 200" stroke-width="2.6" opacity="0.7"/>
  </g>

  <!-- dotted nodes -->
  <g>
    <circle cx="820" cy="120" r="8" fill="#0b6c89" opacity="0.95" />
    <circle cx="980" cy="220" r="7" fill="#05a9d0" opacity="0.9" />
    <circle cx="1260" cy="220" r="7" fill="#0b6c89" opacity="0.8" />
  </g>

  <!-- soft abstract right overlay -->
  <g filter="url(#soft)">
    <ellipse cx="1500" cy="360" rx="520" ry="240" fill="url(#g2)" opacity="0.55" />
  </g>

  <!-- logo area: embed actual PNG logo and small caption -->
  <g transform="translate(80,170)">
    <rect x="0" y="0" width="520" height="220" rx="12" fill="#ffffff" fill-opacity="0.92" />
     <text x="30" y="90" font-family="'Segoe UI', Roboto, Helvetica, Arial" font-size="36" fill="#0b0b0b" font-weight="800">DMeX Solutions</text>
     <text x="30" y="140" font-family="'Segoe UI', Roboto, Helvetica, Arial" font-size="36" fill="#0b0b0b" font-weight="700">Technical Feed</text>
  </g>

  <!-- subtle grid on bottom -->
  <g stroke="#e2f4fb" stroke-width="1">
    <path d="M0 640 H1920" />
    <path d="M0 600 H1920" />
  </g>

</svg>
